name: Daily Tech Tips

on:
  schedule:
    # Run daily at 9:00 AM UTC (adjust timezone as needed)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # Install Python for rule fetching and JSON formatting
          sudo apt-get update && sudo apt-get install -y python3

      - name: Generate Tech Tip
        id: generate_tip
        run: |
          DATE=$(date +"%Y-%m-%d")
          DAY_NAME=$(date +"%A")
          DAY_OF_YEAR=$(date +"%j")
          export DATE DAY_NAME DAY_OF_YEAR
          python3 utils/tech_daily.py generate-tip

      - name: Format and Send to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TIP: ${{ steps.generate_tip.outputs.tip }}
        run: |
          DATE=$(date +"%Y-%m-%d")
          export DATE

          # Use Python utility to properly escape JSON and create Slack message
          python3 utils/tech_daily.py format-slack --output /tmp/slack_message.json
          
          # Check if Slack webhook URL is available
          if [ -z "$SLACK_WEBHOOK_URL" ] || [ "$SLACK_WEBHOOK_URL" = "" ]; then
            echo "⚠️ Slack webhook URL not configured, printing message instead:"
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📚 Daily Tech Tip - $DATE"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
            echo "$TIP"
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "💡 Generated by GitHub Actions | #tech-daily"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
            echo "📋 JSON payload (for when webhook is ready):"
            cat /tmp/slack_message.json
          else
            # Send to Slack
            curl -X POST -H 'Content-type: application/json' \
              --data @/tmp/slack_message.json \
              "$SLACK_WEBHOOK_URL"
            
            echo "✅ Tech tip sent to Slack successfully!"
          fi
